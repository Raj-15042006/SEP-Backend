server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: skills-passport-backend

  threads:
    virtual:
      enabled: false

  datasource:
    url: jdbc:h2:mem:passport_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
    hikari:
      maximum-pool-size: 10
      pool-name: LocalH2Pool

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false

  flyway:
    enabled: false

  kafka:
    bootstrap-servers: localhost:9092

minio:
  endpoint: http://localhost:9000
  accessKey: admin
  secretKey: password123
  bucketName: evidence-artefacts

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
